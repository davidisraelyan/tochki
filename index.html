<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Точки — обход</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Точки">
<meta name="theme-color" content="#0b5d3b">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b5d3b'/%3E%3Cpath d='M50 20c-11 0-20 9-20 20 0 15 20 40 20 40s20-25 20-40c0-11-9-20-20-20z' fill='%23fff'/%3E%3Ccircle cx='50' cy='40' r='7' fill='%230b5d3b'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#eef1ee; --card:#ffffff; --ink:#12211a; --muted:#68786f;
    --line:#dfe6e1; --brand:#0b5d3b; --brand-ink:#ffffff;
    --green:#15803d; --green-bg:#e6f6ec;
    --red:#b42318; --red-bg:#fdeceb;
    --amber:#a16207; --amber-bg:#fdf3dc;
    --shadow:0 1px 2px rgba(16,40,28,.06),0 6px 18px rgba(16,40,28,.06);
    --r:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1210; --card:#171f1b; --ink:#e8efea; --muted:#93a49a;
      --line:#26332c; --brand:#3fbf86; --brand-ink:#04130c;
      --green:#6ee7a4; --green-bg:#12301f;
      --red:#fca5a5; --red-bg:#3a1514;
      --amber:#fcd34d; --amber-bg:#3a2a0a;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  button,a,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
  button{background:none;border:0;padding:0;cursor:pointer}

  header.top{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .h-title{font-weight:700;font-size:20px;letter-spacing:-.02em}
  .h-sub{color:var(--muted);font-size:13px;margin-top:1px}
  .h-count{
    margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;
    box-shadow:var(--shadow);white-space:nowrap;
  }
  .iconbtn{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);flex:none;
  }
  .iconbtn svg{width:20px;height:20px;display:block}

  main{padding:12px 14px 8px;max-width:680px;margin:0 auto}
  .search{
    display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:0 12px;box-shadow:var(--shadow);margin-bottom:10px;
  }
  .search svg{width:18px;height:18px;flex:none;color:var(--muted)}
  .search input{
    flex:1;border:0;background:transparent;outline:none;padding:13px 0;font-size:16px;min-width:0;
  }

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:8px 13px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;
  }
  .chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:14px;margin-bottom:10px;box-shadow:var(--shadow);
  }
  .card.done{opacity:.72}
  .row{display:flex;align-items:center;gap:8px}
  .name{font-weight:650;font-size:16.5px;letter-spacing:-.01em;min-width:0}
  .pill{
    font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;flex:none;
  }
  .pill.order{color:var(--green);background:var(--green-bg)}
  .pill.refusal{color:var(--red);background:var(--red-bg)}
  .pill.nolpr{color:var(--amber);background:var(--amber-bg)}
  .pill.none{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent)}
  .addr{
    display:inline-flex;align-items:center;gap:6px;margin-top:7px;text-decoration:none;
    color:var(--brand);font-size:15px;font-weight:600;line-height:1.3;padding:4px 0;
  }
  .addr svg{width:15px;height:15px;flex:none}
  .addr:active{opacity:.6}
  .phone{display:block;margin-top:2px;color:var(--muted);font-size:14px;text-decoration:none}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .btn{
    border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 3%,transparent);
    padding:8px 11px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);
    display:inline-flex;align-items:center;gap:5px;
  }
  .btn:active{transform:scale(.97)}
  .btn.sel{color:var(--brand-ink);background:var(--brand);border-color:var(--brand)}
  .btn.order.sel{background:var(--green);border-color:var(--green);color:#fff}
  .btn.refusal.sel{background:var(--red);border-color:var(--red);color:#fff}
  .btn.nolpr.sel{background:var(--amber);border-color:var(--amber);color:#231a02}
  .btn.visited.sel{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
  .note{
    width:100%;margin-top:10px;border:1px solid var(--line);background:var(--bg);
    border-radius:11px;padding:10px 11px;font-size:15px;resize:vertical;min-height:56px;outline:none;
  }
  .note:focus{border-color:var(--brand)}
  .empty{color:var(--muted);text-align:center;padding:36px 20px;font-size:15px}

  /* маршрут */
  .route-head{display:flex;gap:8px;margin-bottom:12px}
  .bigbtn{
    flex:1;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:14px;
    font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:var(--shadow);
  }
  .bigbtn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);flex:none;padding:14px 16px}
  .bigbtn:disabled{opacity:.45}
  .rlist{counter-reset:r}
  .ritem{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 46px;
    margin-bottom:8px;position:relative;box-shadow:var(--shadow);
  }
  .ritem::before{
    counter-increment:r;content:counter(r);
    position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:50%;
    background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);
    font-size:12.5px;font-weight:800;display:grid;place-items:center;
  }
  .ritem.current{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
  .badge-next{
    font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--brand);margin-bottom:3px;
  }
  .rctl{display:flex;gap:6px;margin-top:8px}
  .rctl .btn{padding:7px 10px;font-size:13px}

  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;gap:8px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));
    background:var(--bg);
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;
    color:var(--muted);font-size:11.5px;font-weight:600;border-radius:12px;
  }
  .tab svg{width:22px;height:22px}
  .tab.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}
  .tab .cnt{position:absolute;transform:translate(16px,-4px);background:var(--brand);color:var(--brand-ink);
    font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px}

  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
  .sheet-bg.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);
    border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .22s cubic-bezier(.22,.8,.3,1);
    box-shadow:0 -10px 40px rgba(0,0,0,.25);
  }
  .sheet.on{transform:translateY(0)}
  .sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
  .sheet button.sitem{
    display:flex;width:100%;align-items:center;gap:12px;padding:14px 6px;font-size:16px;font-weight:600;
    border-bottom:1px solid var(--line);text-align:left;
  }
  .sheet button.sitem:last-of-type{border-bottom:0}
  .sheet button.sitem.danger{color:var(--red)}
  .sheet .hint{color:var(--muted);font-size:12.5px;padding:12px 6px 0;line-height:1.45}
  .toast{
    position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:#12211a;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;
    opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:88vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media (prefers-color-scheme: dark){ .toast{background:#e8efea;color:#0d1210} }
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="h-title">Точки</div>
    <div class="h-sub" id="sub">обход за день</div>
  </div>
  <div class="h-count" id="count">0 / 0</div>
  <button class="iconbtn" id="menuBtn" aria-label="Меню">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
  </button>
</header>

<main>
  <section id="view-all">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Название или адрес" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="all">Все</button>
      <button class="chip" data-f="todo">Не обойдено</button>
      <button class="chip" data-f="order">Заказ</button>
      <button class="chip" data-f="refusal">Отказ</button>
      <button class="chip" data-f="nolpr">Нет ЛПР</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="view-route" hidden>
    <div class="route-head">
      <button class="bigbtn" id="openRoute">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/><path d="M9 7v13M15 4v13"/></svg>
        Открыть маршрут
      </button>
      <button class="bigbtn ghost" id="addTodo" title="Добавить все не обойдённые">＋</button>
    </div>
    <div id="routeList" class="rlist"></div>
    <div id="routeEmpty" class="empty">Маршрут пуст.<br>В списке точек нажми «В маршрут» —<br>порядок обхода можно менять.</div>
  </section>
</main>

<nav class="tabs">
  <button class="tab on" data-tab="all">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    Точки
  </button>
  <button class="tab" data-tab="route">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V8a4 4 0 014-4h2"/><path d="M17 21l3-3-3-3"/><path d="M20 18H9a5 5 0 01-5-5V8"/></svg>
    Маршрут
  </button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <button class="sitem" data-menu="export">⬇︎ Сохранить копию данных</button>
  <button class="sitem" data-menu="import">⬆︎ Загрузить данные из файла</button>
  <button class="sitem danger" data-menu="reset">↺ Сбросить отметки</button>
  <div class="hint">Копия сохраняется в «Файлы» на iPhone. Если данные пропадут после чистки Safari — загрузите копию отсюда.</div>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY = "tochki_v1";
const RESULT = {
  order:   {label:"Заказ",     cls:"order"},
  refusal: {label:"Отказ",     cls:"refusal"},
  nolpr:   {label:"Нет ЛПР",   cls:"nolpr"},
};

/* demo-данные: заменяются реальным списком точек */
const SEED = {
  points: [
    {id:"p1",  name:"Магнит «Центральный»",  address:"Москва, ул. Тверская, 12",          phone:"",                  note:""},
    {id:"p2",  name:"Пятёрочка",             address:"Москва, ул. Тверская, 25",          phone:"",                  note:""},
    {id:"p3",  name:"Перекрёсток",           address:"Москва, Малая Дмитровка, 3",        phone:"",                  note:""},
    {id:"p4",  name:"Дикси",                 address:"Москва, Пушкинская пл., 1",         phone:"",                  note:""},
    {id:"p5",  name:"ВкусВилл",              address:"Москва, Страстной б-р, 5",          phone:"",                  note:""},
    {id:"p6",  name:"Аптека «Здоровье»",     address:"Москва, Петровка, 19",              phone:"",                  note:""},
    {id:"p7",  name:"Магнит",                address:"Москва, Кузнецкий Мост, 9",         phone:"",                  note:""},
    {id:"p8",  name:"Пятёрочка",             address:"Москва, Рождественка, 6",           phone:"",                  note:""},
    {id:"p9",  name:"Лента",                 address:"Москва, Рождественка, 20/8",        phone:"",                  note:""},
    {id:"p10", name:"Перекрёсток",           address:"Москва, Никольская, 10",            phone:"",                  note:""},
  ],
  route: [],
};

let state = load();
let filter = "all", query = "";
let activeTab = "all";
const openNotes = new Set();

function normalize(p){
  return {
    id: p.id || "p" + Math.random().toString(36).slice(2, 9),
    name: p.name || "Без названия",
    address: p.address || "",
    phone: p.phone || "",
    note: p.note || "",
    visited: !!p.visited,
    result: p.result && RESULT[p.result] ? p.result : null,
  };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return normalizeState(JSON.parse(JSON.stringify(SEED)));
    return normalizeState(JSON.parse(raw));
  }catch(e){ return normalizeState(JSON.parse(JSON.stringify(SEED))); }
}
function normalizeState(s){
  const points = (s.points || []).map(normalize);
  const ids = new Set(points.map(p => p.id));
  const route = (s.route || []).filter(id => ids.has(id));
  return {points, route};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast("Не удалось сохранить — память браузера недоступна"); }
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mapsUrl = addr => "https://yandex.ru/maps/?text=" + encodeURIComponent(addr);
function openExternal(url){
  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}
const routeUrl = addrs => addrs.length
  ? "https://yandex.ru/maps/?rtt=auto&rtext=" + addrs.map(encodeURIComponent).join("~")
  : "";

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2200);
}
function pointById(id){ return state.points.find(p => p.id === id); }

function visiblePoints(){
  let arr = state.points.slice();
  if(query){
    const q = query.toLowerCase().trim();
    arr = arr.filter(p => (p.name + " " + p.address).toLowerCase().includes(q));
  }
  if(filter === "todo") arr = arr.filter(p => !p.visited);
  if(filter !== "all" && filter !== "todo") arr = arr.filter(p => p.result === filter);
  return arr;
}

function cardHtml(p){
  const inRoute = state.route.includes(p.id);
  const res = p.result ? RESULT[p.result] : null;
  return `<article class="card ${p.visited ? "done" : ""}" data-id="${p.id}">
    <div class="row">
      <div class="name">${esc(p.name)}</div>
      <span class="pill ${res ? res.cls : "none"}" style="margin-left:auto">${res ? res.label : "Не обойдено"}</span>
    </div>
    ${p.address ? `<a class="addr" href="${mapsUrl(p.address)}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11a7 7 0 10-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
      ${esc(p.address)}
    </a>` : ""}
    ${p.phone ? `<a class="phone" href="tel:${esc(p.phone)}">${esc(p.phone)}</a>` : ""}
    <div class="acts">
      <button class="btn visited ${p.visited ? "sel" : ""}" data-act="visited">${p.visited ? "✓ Обойдено" : "○ Обойти"}</button>
      <button class="btn order ${p.result === "order" ? "sel" : ""}" data-act="order">Заказ</button>
      <button class="btn refusal ${p.result === "refusal" ? "sel" : ""}" data-act="refusal">Отказ</button>
      <button class="btn nolpr ${p.result === "nolpr" ? "sel" : ""}" data-act="nolpr">Нет ЛПР</button>
      <button class="btn ${inRoute ? "sel" : ""}" data-act="route">${inRoute ? "✓ В маршруте" : "＋ В маршрут"}</button>
      <button class="btn ${openNotes.has(p.id) ? "sel" : ""}" data-act="note">Заметка</button>
    </div>
    <textarea class="note" data-note placeholder="Что сказали, что привезти, кому звонить…" ${openNotes.has(p.id) ? "" : "hidden"}>${esc(p.note)}</textarea>
  </article>`;
}

function renderList(){
  const arr = visiblePoints();
  $("#list").innerHTML = arr.length ? arr.map(cardHtml).join("")
    : `<div class="empty">Ничего не найдено.<br>Попробуй другой фильтр или запрос.</div>`;
}

function renderRoute(){
  const items = state.route.map(pointById).filter(Boolean);
  $("#routeEmpty").hidden = items.length > 0;
  $("#routeList").hidden = items.length === 0;
  const nextIdx = items.findIndex(p => !p.visited);
  $("#routeList").innerHTML = items.map((p, i) => {
    const res = p.result ? RESULT[p.result] : null;
    return `<div class="ritem ${i === nextIdx ? "current" : ""}" data-id="${p.id}">
      ${i === nextIdx ? `<div class="badge-next">Следующая</div>` : ""}
      <div class="row"><div class="name">${esc(p.name)}</div>
        <span class="pill ${res ? res.cls : "none"}" style="margin-left:auto">${res ? res.label : (p.visited ? "Обойдено" : "Ожидает")}</span></div>
      <a class="addr" href="${mapsUrl(p.address)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11a7 7 0 10-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        ${esc(p.address)}</a>
      <div class="rctl">
        <button class="btn" data-r="up" ${i === 0 ? "disabled" : ""}>▲</button>
        <button class="btn" data-r="down" ${i === items.length - 1 ? "disabled" : ""}>▼</button>
        <button class="btn" data-r="next">Перейти</button>
        <button class="btn" data-r="rm" style="margin-left:auto">✕</button>
      </div>
    </div>`;
  }).join("");
  const visitedInRoute = items.filter(p => p.visited).length;
  $("#sub").textContent = items.length ? `в маршруте ${items.length} · обойдено ${visitedInRoute}` : "обход за день";
  $("#openRoute").disabled = items.length === 0;
}

function renderCounts(){
  const total = state.points.length;
  const done = state.points.filter(p => p.visited).length;
  $("#count").textContent = done + " / " + total;
}

function render(){
  renderList(); renderRoute(); renderCounts();
}

/* ---------- действия ---------- */
function setResult(id, res){
  const p = pointById(id); if(!p) return;
  p.result = (p.result === res) ? null : res;
  if(p.result) p.visited = true;
  save(); render();
}
function toggleVisited(id){
  const p = pointById(id); if(!p) return;
  p.visited = !p.visited;
  if(!p.visited && p.result) p.result = null;
  save(); render();
}
function toggleRoute(id){
  const i = state.route.indexOf(id);
  if(i >= 0) state.route.splice(i, 1); else state.route.push(id);
  save(); render();
}

function onListAction(act, id){
  if(act === "visited") return toggleVisited(id);
  if(act === "route")   return toggleRoute(id);
  if(act === "note"){
    if(openNotes.has(id)) openNotes.delete(id); else openNotes.add(id);
    return renderList();
  }
  if(RESULT[act]) return setResult(id, act);
}

/* ---------- обработчики ---------- */
$("#list").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if(!btn) return;
  const card = e.target.closest("[data-id]");
  onListAction(btn.dataset.act, card.dataset.id);
});
$("#list").addEventListener("input", e => {
  const ta = e.target.closest("[data-note]");
  if(!ta) return;
  const p = pointById(e.target.closest("[data-id]").dataset.id);
  p.note = ta.value; save();
  clearTimeout(ta._t); ta._t = setTimeout(() => {}, 200);
});

$("#routeList").addEventListener("click", e => {
  const item = e.target.closest("[data-id]"); if(!item) return;
  const id = item.dataset.id;
  const btn = e.target.closest("[data-r]");
  if(!btn) return;
  const i = state.route.indexOf(id);
  const op = btn.dataset.r;
  if(op === "rm") state.route.splice(i, 1);
  if(op === "up" && i > 0){ state.route.splice(i,1); state.route.splice(i-1,0,id); }
  if(op === "down" && i < state.route.length-1){ state.route.splice(i,1); state.route.splice(i+1,0,id); }
  if(op === "next"){ openExternal("https://yandex.ru/maps/?rtt=auto&rtext=~" + encodeURIComponent(pointById(id).address)); return; }
  save(); render();
});

$("#q").addEventListener("input", e => { query = e.target.value; renderList(); });
$("#chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if(!c) return;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c));
  filter = c.dataset.f; renderList();
});
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  activeTab = t.dataset.tab;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  $("#view-all").hidden = activeTab !== "all";
  $("#view-route").hidden = activeTab !== "route";
  window.scrollTo({top:0});
}));

$("#openRoute").addEventListener("click", () => {
  const addrs = state.route.map(pointById).filter(p => p && p.address).map(p => p.address);
  if(!addrs.length) return;
  openExternal(routeUrl(addrs));
});
$("#addTodo").addEventListener("click", () => {
  const add = state.points.filter(p => !p.visited && !state.route.includes(p.id)).map(p => p.id);
  if(!add.length) return toast("Все не обойдённые уже в маршруте");
  state.route.push(...add); save(); render(); toast("Добавлено точек: " + add.length);
});

/* меню */
const sheet = $("#sheet"), sheetBg = $("#sheetBg");
function openSheet(v){ sheet.classList.toggle("on", v); sheetBg.classList.toggle("on", v); }
$("#menuBtn").addEventListener("click", () => openSheet(true));
sheetBg.addEventListener("click", () => openSheet(false));

sheet.addEventListener("click", e => {
  const b = e.target.closest("[data-menu]"); if(!b) return;
  const what = b.dataset.menu;
  openSheet(false);
  if(what === "export") exportJson();
  if(what === "import") $("#fileIn").click();
  if(what === "reset"){
    if(!confirm("Сбросить все отметки («обойдено» и результат)? Заметки останутся.")) return;
    state.points.forEach(p => { p.visited = false; p.result = null; });
    save(); render(); toast("Отметки сброшены");
  }
});

function exportJson(){
  const data = JSON.stringify({app:"tochki", version:1, exportedAt:new Date().toISOString(), ...state}, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tochki-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast("Копия сохранена в «Файлы»");
}
$("#fileIn").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const s = JSON.parse(r.result);
      if(!Array.isArray(s.points)) throw new Error("нет списка points");
      state = normalizeState(s);
      save(); render(); toast("Загружено точек: " + state.points.length);
    }catch(err){ toast("Не получилось прочитать файл"); }
  };
  r.readAsText(f);
  e.target.value = "";
});

render();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
